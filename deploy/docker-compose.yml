# Standalone compose. Suitable when D120 runs on its own and HQ + the RAG
# service are reachable from the container via host.docker.internal.
#
# Requires Docker Compose v2.17+ (BuildKit named build contexts).
#
# For the demo EC2 (where the RAG service does NOT publish 4500 on the host
# but runs on the voyager-rag-demo_default network under alias `rag`), use
# docker-compose.demo.yml instead.

services:
  processes:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      additional_contexts:
        prov: ../../voyager-prov-ts
    image: voyager-processes-profiler:0.2.0
    container_name: voyager-processes-profiler
    restart: unless-stopped
    ports:
      - "4601:4601"
    env_file:
      - ./processes.env
    extra_hosts:
      # Reach the docker host on Linux, matching voyager-mastra-full-rag pattern.
      - "host.docker.internal:host-gateway"
